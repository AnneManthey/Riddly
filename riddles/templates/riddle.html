{% extends 'layout.html' %}

{% block title %}
  Rätsel {{ door.title }}
{% endblock %}

{% block content %}
  {% comment %} <h1>Rätsel {{ door.title }}</h1> {% endcomment %}

  <section class="riddle">
    {% if door.image %}
      <img src="{{ door.image.url }}" alt="" />
    {% endif %}
    <section class="riddle-box">
      <p class="riddle-text">{{ door.riddle }}</p>
      <br>
      <p class="riddle-text">{{ door.question }}</p>
    </section>
    

    <form class="riddle-form" action="/action_page.php">
      {% comment %} <label for="fname">Antwort</label> {% endcomment %}
      <input type="text" id="fname" name="fname" />
      <button class="absenden-btn">Absenden</button>
    </form>
  </section>
{% endblock %}
