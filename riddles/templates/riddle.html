{% extends 'layout.html' %}

{% block title %}
  Rätsel {{ door.title }}
{% endblock %}

{% block content %}
  <h1>Rätsel {{ door.title }}</h1>

  <section class="riddle">
    {% if door.image %}
      <img src="{{ door.image.url }}" alt="" />
    {% endif %}
    <section class="riddle-box">
      <p class="riddle-text">{{ door.riddle }}</p>
    </section>
    

    <form class="riddle-form" action="/action_page.php">
      <label for="fname">{{ door.question }}</label>
      <input type="text" id="fname" name="fname" />
      <button class="absenden-btn">Absenden</button>
      {% comment %} <input type="submit" value="Absenden" /> {% endcomment %}
    </form>
  </section>
{% endblock %}
