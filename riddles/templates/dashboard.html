{% extends 'layout.html' %}

{% block title %}
  Adventskalender
{% endblock %}

{% block content %}

  
  <section class="door-section">
    {% for door in doors %}
    <article>
      <a class="single-door" href="{% url 'riddle' slug=door.slug %}">
        {% if door.solved %}
          <p>{{ door.loot }}</p>
        {% else %}
          <h2>{{ door.title }}</h2>
        {% endif %}
      </a>
    </article>
  {% endfor %}
  </section>
{% endblock %}
