{% extends 'layout.html' %}

{% block title %}
  Dashboard
{% endblock %}

{% block content %}
  <h1>Riddly</h1>
  
  <section class="door-section">
    {% for door in doors %}
    <article>
      <button class="single-door">
        <a href="{% url 'riddle' slug=door.slug %}">
          <h2>{{ door.title }}</h2>
        <p>{{ door.loot }}</p>
        </a>
      </button>
    </article>
  {% endfor %}
  </section>
{% endblock %}
