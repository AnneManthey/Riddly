{% extends 'layout.html' %}

{% block title %}
  Adventskalender
{% endblock %}

{% block content %}

  
  <section class="door-section">
    {% for door in doors %}
    <article>
      <a class="single-door" href="{% url 'riddle' slug=door.slug %}">
        <h2>{{ door.title }}</h2>
        <p>{{ door.loot }}</p>
      </a>
    </article>
  {% endfor %}
  </section>
{% endblock %}
