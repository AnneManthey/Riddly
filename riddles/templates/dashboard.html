{% extends 'layout.html' %}

{% block title %}
  Adventskalender
{% endblock %}

{% block content %}

  
  <section class="door-section">
    {% for door in doors %}
    <article>
      <button class="single-door">
        <a href="{% url 'riddle' slug=door.slug %}">
          <h2>{{ door.title }}</h2>
        <p>{{ door.loot }}</p>
        </a>
      </button>
    </article>
  {% endfor %}
  </section>
{% endblock %}
