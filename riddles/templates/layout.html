<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Riddly
      {% endblock %}
    </title>
    <link rel="icon" type="image/png" href="{% get_media_prefix %}img/favicon.png" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/fonts.css' %}" />
    <script src="{% static 'js/script.js' %}" defer></script>
  </head>
  <body>
    <header>
      {% if user.is_authenticated %}
      <div class="header-user">
        <span class="user-info">Eingeloggt als {{ user.username }} |</span>
        <form class="logout" action="{% url 'logout' %}" method="post">
          {% csrf_token %}
          <button class="logout-btn">Logout</button>
        </form>
      </div>
      {% endif %}
      
    </header>
    <main>
      {% block content %}

      {% endblock %}
    </main>

    <footer>
      © 2026 | <a href="/imprint">Impressum</a> | <a href="/admin/">Admin</a>
    </footer>
  </body>
</html>
