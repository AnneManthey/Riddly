<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Riddly
      {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <script src="{% static 'js/script.js' %}" defer></script>
  </head>
  <body>
    <header>
      {% comment %} Eingeloggt als{{}} {% endcomment %}
      <form class="logout" action="{% url 'login' %}"method="post">
        {% csrf_token %}
        <button class="logout-btn">Logout</button>
      </form>
    </header>
    <main>
      {% block content %}

      {% endblock %}
    </main>

    <footer>
      © 2026 | <a href="/imprint">Impressum</a> 
    </footer>
  </body>
</html>
